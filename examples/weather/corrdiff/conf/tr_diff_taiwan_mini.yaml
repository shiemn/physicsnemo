# UNREFERENCED: nothing outside this file names it -- superseded by conf/train/europa/diffusion_mini.yaml.
# Kept for provenance of past runs; prefer the replacement for new work.
# Diffusion training for Taiwan (CWB) — conditioned on mini non-temporal regression.

hydra:
    job:
          chdir: false
          name: tr_diff_taiwan_mini
    run:
          dir: ./output/${hydra:job.name}
    searchpath:
          - pkg://conf/base # Do not modify

defaults:
    - dataset: cwb
    - model: diffusion
    - model_size: normal
    - training: ${model}

dataset:
    data_path: /data/cwa_dataset/cwa_dataset.zarr

model:
    hr_mean_conditioning: true

training:
    hp:
        training_duration: 2000000
        lr_rampup: 100000
        batch_size_per_gpu: 4
    io:
        checkpoint_dir: /checkpoints/taiwan_diffusion_mini
        regression_checkpoint_path: /checkpoints/taiwan_regression_mini/checkpoints_regression/UNet.0.2000128.mdlus
        save_checkpoint_freq: 100000
        save_n_recent_checkpoints: -1
        validation_freq: 100000
        print_progress_freq: 100000

validation:
    train: false
    all_times: false

wandb:
    mode: online
    results_dir: "./wandb"
    watch_model: false
