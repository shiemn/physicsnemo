# Config for time-parallel generation with heteroscedastic diffusion model
# Uses uncertainty-aware sampling for calibrated ensemble spread
#
# Usage:
#   torchrun --nproc_per_node=4 generate_parallel_times.py --config-name=gen_heteroscedastic_parallel
#
# With HP evaluation (tests multiple sampler configs):
#   torchrun --nproc_per_node=4 generate_parallel_times.py --config-name=gen_heteroscedastic_parallel \
#       generation.hp_eval=true

hydra:
    job:
          chdir: false
          name: gen_heteroscedastic_parallel
    run:
          dir: ./outputs/${hydra:job.name}
    searchpath:
          - pkg://conf/base # Do not modify

defaults:
    - dataset: custom
    - generation: non_patched


# Dataset parameters
dataset:
    type: norway
    data_path: /data/Norway/HCLIM3/preprocessed_large/NorCP_AROME_EC-EARTH
    stats_path: /data/Norway/HCLIM3/preprocessed_large/NorCP_AROME_EC-EARTH
    invariant_variables_path: /data/Norway/HCLIM3/

    output_variables: ['precipitation']
    input_variables: ["hus500","hus850","ua500","ua850","va500","va850","ta500","ta850"]
    invariant_variables: ["elevation"]
    bounds: large
    years: [2005]


# Uncertainty-aware sampler configuration
sampler:
    type: uncertainty_aware
    num_steps: 18
    # Base stochastic sampling parameters
    S_churn: 40
    S_min: 0
    S_max: .inf
    # Uncertainty-aware specific parameters
    use_predicted_uncertainty: false
    # Whether to use the network's predicted std to modulate noise
    uncertainty_scale: 1.0
    # Scaling factor for predicted uncertainty:
    #   0.0 = ignore predicted uncertainty (standard stochastic)
    #   1.0 = full use of predicted uncertainty
    #   >1.0 = amplify uncertainty effect (more ensemble spread)

generation:
    num_ensembles: 10
    # int, number of ensembles to generate per input
    seed_batch_size: 10
    # int, size of the batched inference
    use_heteroscedastic_model: auto
    save_predicted_uncertainty: true
    uncertainty_output_name: predicted_std
    uncertainty_sigma_probe: 0.001
