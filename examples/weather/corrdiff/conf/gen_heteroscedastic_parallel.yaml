    # Set to true to test multiple sampler configs and pick best
    hp_eval: true

    # Time range for generation
    #times_range: ["2005-01-01T00:00:00", "2005-12-31T23:59:59", 3]

    io:
        # Heteroscedastic diffusion model checkpoint
        res_ckpt_filename: /checkpoints/heteroscedastic_twcrps2/checkpoints_heteroscedastic_diffusion/HeteroscedasticEDMPrecondSR.0.1300224.mdlus
        # Regression model checkpoint (same as used for training)
        reg_ckpt_filename: /checkpoints/hp_reg_grid/reg_10_combined/checkpoints_regression/UNet.0.1500160.mdlus

        # Output file
        output_filename: /outputs/heteroscedastic_parallel.nc


# Parameters for wandb logging
wandb:
    mode: online
    results_dir: "./wandb"
    watch_model: false
