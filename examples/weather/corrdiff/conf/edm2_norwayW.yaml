# Training config for EDM2 diffusion model on the Norway (large) domain.
hydra:
    job:
          chdir: false
          name: edm2_norwayW
    run:
          dir: ./output/${hydra:job.name}
    searchpath:
          - pkg://conf/base # Do not modify


defaults:

    - dataset: custom
    - model: edm2_diffusion
    - training: ${model}
    # Note: model_size is intentionally omitted — that config sets SongUNet-specific
    # channel_mult=[1,2,2,2,2] which conflicts with EDM2's paper-recommended [1,2,3,4].


model:
    name: edm2_diffusion
    hr_mean_conditioning: True

    model_args:
        attn_resolutions: [16]


dataset:
    type: norway
    data_path: /data/Norway/HCLIM3/preprocessed_large/NorCP_AROME_EC-EARTH
    stats_path: /data/Norway/HCLIM3/preprocessed_large/NorCP_AROME_EC-EARTH
    invariant_variables_path: /data/Norway/HCLIM3/

    years: [1986, 1987, 1988, 1989, 1990, 1991, 1992, 1993, 1994, 1995, 1996, 1997, 1998, 1999, 2000, 2001]

    output_variables: ['precipitation']
    input_variables: ["hus500","hus850","ua500","ua850","va500","va850","ta500","ta850"]
    invariant_variables: ["elevation"]
    bounds: large

validation:
    years: [2003, 2004]


training:
    hp:
        training_duration: 2000000
        batch_size_per_gpu: 7
        total_batch_size: 252
#        lr: 0.0002
        lr: 0.000175

        # Noise distribution parameters from best hp_search
#        distribution: normal
#        P_mean: 0.33279831106168106
#        P_std: 1.2828802382850724
#        sigma_data: 0.9991313898136948

    io:
        print_progress_freq: 10000
        regression_checkpoint_path: /checkpoints/hp_reg_grid/reg_10_combined/checkpoints_regression/UNet.0.1500160.mdlus

        checkpoint_dir: /checkpoints/edm2_norwayW
        save_checkpoint_freq: 100000
        save_n_recent_checkpoints: 20


wandb:
    mode: online
    results_dir: "./wandb"
    watch_model: false
