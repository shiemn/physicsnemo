# DiT V2 regression with temporal inputs (offsets [-1, 0, 1], 24-channel img_lr).
# Same architecture as dit_regression_norway_v2_p4 (patch_size=4) but with
# temporal conditioning — mirrors the UNet tr_reg_hp_temporal setup.

hydra:
    job:
          chdir: false
          name: dit_regression_norway_v2_p4_temporal
    run:
          dir: ./output/${hydra:job.name}
    searchpath:
          - pkg://conf/base

defaults:
    - dataset: custom
    - model: dit_regression_v2
    - training: dit_regression

dataset:
    type: norway
    data_path: /data/Norway/HCLIM3/preprocessed_large/NorCP_AROME_EC-EARTH
    stats_path: /data/Norway/HCLIM3/preprocessed_large/NorCP_AROME_EC-EARTH
    input_variables: ["hus500","hus850","ua500","ua850","va500","va850","ta500","ta850"]
    output_variables: ['precipitation']
    invariant_variables: ["elevation"]
    invariant_variables_path: /data/Norway/HCLIM3/
    bounds: large
    years: [1986, 1987, 1988, 1989, 1990, 1991, 1992, 1993, 1994, 1995, 1996, 1997, 1998, 1999, 2000, 2001]
    temporal_inputs:
        offsets: [-1, 0, 1]
        boundary: drop
        strict_time_step_hours: 3

validation:
    years: [2003, 2004]

model:
    model_args:
        patch_size: 4

training:
    patch_shift_aug: true
    hp:
        training_duration: 2000000
        batch_size_per_gpu: 8
        total_batch_size: 256
        loss_function: flexiloss
        flexi_loss_p: [1.25]
        flexi_loss_d: [1]
    io:
        checkpoint_dir: /checkpoints/dit_regression_norway_v2_p4_temporal
        save_checkpoint_freq: 100000
        save_n_recent_checkpoints: 0
        validation_freq: 100000
        print_progress_freq: 10000

wandb:
    mode: online
    results_dir: "./wandb"
    watch_model: false
