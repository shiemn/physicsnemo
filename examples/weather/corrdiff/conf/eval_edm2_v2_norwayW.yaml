# Evaluation config for EDM2 v2 diffusion model on Norway (large) domain.
# Must match edm2_v2_norwayW.yaml (training config).
#
# Usage on helma:
#   sbatch jobs/helma/eval.slurm /checkpoints/edm2_v2_norwayW/checkpoints_edm2_diffusion/EDM2PrecondSuperResolution.0.XXXXXX.pt
#
# Usage locally (single GPU):
#   python evaluate.py --config-name=eval_edm2_v2_norwayW \
#       run_tag=edm2_v2_test \
#       generation.io.res_ckpt_filename=/path/to/EDM2PrecondSuperResolution.0.XXXXXX.pt

hydra:
    job:
        chdir: false
        name: eval_edm2_v2
    run:
        dir: ./outputs/${hydra:job.name}
    searchpath:
        - pkg://conf/base   # Do not modify

defaults:
    - dataset: custom
    - generation: non_patched

# ── Experiment identifier ─────────────────────────────────────────────────────
run_tag: ???

# ── W&B settings ─────────────────────────────────────────────────────────────
wandb:
    mode: online
    project: evaluation
    entity: shiemn
    results_dir: ./wandb

# ── Evaluation settings ───────────────────────────────────────────────────────
eval:
    precip_threshold: 1.0
    output_json: eval_results.json
    twcrps_thresholds: [5.0, 10.0]
    n_plot_events: 5
    plot_events: null
    rapsd_dx_km: 2.0
    predictions_file: edmv2_15M.nc  # "auto" = derive from checkpoint name; explicit path to save/load; null to disable

# ── Dataset (matches edm2_v2_norwayW training config) ────────────────────────
dataset:
    type: norway
    data_path: /data/Norway/HCLIM3/preprocessed_large/NorCP_AROME_EC-EARTH
    stats_path: /data/Norway/HCLIM3/preprocessed_large/NorCP_AROME_EC-EARTH
    invariant_variables_path: /data/Norway/HCLIM3/
    output_variables: ['precipitation']
    input_variables: ["hus500","hus850","ua500","ua850","va500","va850","ta500","ta850"]
    invariant_variables: ["elevation"]
    bounds: large
    years: [2005]

# ── Sampler ──────────────────────────────────────────────────────────────────
sampler:
    type: stochastic
    num_steps: 18
    S_churn: 40
    S_min: 0
    S_max: .inf

# ── Generation ───────────────────────────────────────────────────────────────
generation:
    inference_mode: all
    num_ensembles: 10
    seed_batch_size: 10
    hr_mean_conditioning: true

    io:
        # Regression checkpoint — shared across all diffusion model evaluations
        reg_ckpt_filename: /checkpoints/hp_reg_grid/reg_07_flexi_p125/checkpoints_regression/UNet.0.1700096.mdlus
        # EDM2 v2 diffusion checkpoint — override on the command line
        res_ckpt_filename: /checkpoints/edm2_v2_norwayW/checkpoints_edm2_diffusion/EDM2PrecondSuperResolution.0.1500160.mdlus
        output_filename: /dev/null

    # Eval timesteps — 128 high-precipitation events from 2005
