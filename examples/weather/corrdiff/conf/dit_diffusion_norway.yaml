hydra:
    job:
          chdir: false
          name: dit_diffusion_norway
    run:
          dir: ./output/${hydra:job.name}
    searchpath:
          - pkg://conf/base

defaults:
    - dataset: custom
    - model: dit_diffusion
    - training: dit_diffusion

dataset:
    type: norway
    data_path: /data/Norway/HCLIM3/preprocessed_large/NorCP_AROME_EC-EARTH
    stats_path: /data/Norway/HCLIM3/preprocessed_large/NorCP_AROME_EC-EARTH
    input_variables: ["hus500","hus850","ua500","ua850","va500","va850","ta500","ta850"]
    output_variables: ['precipitation']
    invariant_variables: ["elevation"]
    invariant_variables_path: /data/Norway/HCLIM3/
    bounds: large   # 512x512; patch_size=16 → 1024 tokens

validation:
    years: [2003, 2004]

model:
    hr_mean_conditioning: True
    model_args:
        patch_size: 16   # 512/16 = 32 patches per side → 1024 tokens

training:
    hp:
        training_duration: 2000000
        batch_size_per_gpu: 4
        total_batch_size: 64
    io:
        checkpoint_dir: /checkpoints/dit_diffusion_norway
        regression_checkpoint_path: /checkpoints/dit_regression_norway/checkpoints_dit_regression/DiTRegressionUNet.0.2000000.mdlus
        save_checkpoint_freq: 100000
        save_n_recent_checkpoints: 0
        validation_freq: 100000
        print_progress_freq: 10000

wandb:
    mode: online
    results_dir: "./wandb"
    watch_model: false
