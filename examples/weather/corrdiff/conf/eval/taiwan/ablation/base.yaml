# @package _global_
hydra:
  job:
    chdir: false
    name: taiwan_ablation_${target}_${stage}_eval
  run:
    dir: ./outputs/${hydra:job.name}
defaults:
  - /dataset: cwb
  - /generation: non_patched
  - /times: taiwan256
  - _self_
target: ???
stage: ???
run_tag: taiwan_ablation_${target}_${stage}_2m
wandb:
  mode: online
  entity: shiemn
  project: evaluation
  results_dir: ./wandb
dataset:
  data_path: /data/cwa_dataset/cwa_dataset.zarr
  train: false
  all_times: true
eval:
  output_json: eval_results.json
  predictions_file: predictions.nc
  stream_predictions: true
  save_inputs: false
  n_plot_events: 0
  per_channel_metrics: true
  skip_conditional_metrics: true
  twcrps_thresholds: []
  log_regression: true
  diagnostic_channel: 0
  rapsd_dx_km: 3.0
  spread_skill_bin_mode: quantile
sampler:
  type: stochastic
  num_steps: 18
  S_churn: 0
  S_min: 0
  S_max: .inf
generation:
  inference_mode: all
  num_ensembles: 10
  seed_batch_size: 2
  hr_mean_conditioning: true
  perf:
    use_fp16: false
    use_torch_compile: false
  io:
    reg_ckpt_filename: /checkpoints/taiwan_ablation/${target}/regression/checkpoints_regression/UNet.0.2000128.mdlus
    res_ckpt_filename: /checkpoints/taiwan_ablation/${target}/${stage}/checkpoints_diffusion/EDMPrecondSuperResolution.0.2000128.mdlus
    output_filename: /dev/null
    guide_ckpt_filename: null
  guidance_scale: 0.0
  guidance_schedule_alpha: 0.0
