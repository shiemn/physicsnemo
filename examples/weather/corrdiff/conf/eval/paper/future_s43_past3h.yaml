# @package _global_
# Ready-to-run paper-protocol config for the epoch-balanced Scandinavia
# future-confidence pool: past3h model, seed 43.

defaults:
  - /eval/paper/base
  - _self_

run_tag: future_conf_s43_past3h_epoch_balanced_paper

eval:
    figure_title_context: Scandinavia future-confidence past3h (seed 43)

    inputs:
      - epoch: current
        label: current_2005
        path: /outputs/eval/future_conf_s43_past3h_current_2005/predictions.nc
      - epoch: mid
        label: mid_start_2041_2042
        path: /outputs/eval/future_conf_s43_past3h_mid_start_2041_2042/predictions.nc
      - epoch: mid
        label: mid_end_2059_2060
        path: /outputs/eval/future_conf_s43_past3h_mid_end_2059_2060/predictions.nc
      - epoch: end
        label: end_start_2081_2082
        path: /outputs/eval/future_conf_s43_past3h_end_start_2081_2082/predictions.nc
      - epoch: end
        label: end_end_2099_2100
        path: /outputs/eval/future_conf_s43_past3h_end_end_2099_2100/predictions.nc

    target_set: conf/paper_targets/epoch_balanced_12.yaml
