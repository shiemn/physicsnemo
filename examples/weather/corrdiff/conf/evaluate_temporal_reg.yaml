# Evaluation config for regression models trained with temporal inputs.
# Identical to evaluate.yaml but adds dataset.temporal_inputs to match
# the tr_reg_hp_temporal training config (offsets: [-1, 0, 1]).
#
# Usage:
#   sbatch jobs/helma/eval.slurm evaluate_temporal_reg <run_tag> \
#       generation.io.reg_ckpt_filename=/checkpoints/.../<model>.mdlus \
#       generation.io.res_ckpt_filename=/dev/null

