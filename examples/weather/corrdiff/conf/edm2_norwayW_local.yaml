# Training config for EDM2 diffusion model on the Norway (large) domain.

hydra:
    job:
          chdir: false
          name: edm2_norwayW
    run:
          dir: ./output/${hydra:job.name}
    searchpath:
          - pkg://conf/base # Do not modify


defaults:

    - dataset: custom
    - model: edm2_diffusion
    - training: ${model}
    # Note: model_size is intentionally omitted — that config sets SongUNet-specific
    # channel_mult=[1,2,2,2,2] which conflicts with EDM2's paper-recommended [1,2,3,4].


model:
    name: edm2_diffusion
    hr_mean_conditioning: True

    # Norway large domain: min(H, W) drives the U-Net resolution ladder.
    # With attn_resolutions=[16] we get attention only at 16px (saves memory).
    model_args:
        attn_resolutions: [16]

    # Noise distribution (same defaults as other Norway diffusion runs)
    # Override sigma_data here if needed; set in training.hp as well.


dataset:
    type: norway
    data_path: /Users/simon/Datasets/Norway/HCLIM3/preprocessed_large/NorCP_AROME_EC-EARTH
    stats_path: /Users/simon/Datasets/Norway/HCLIM3/preprocessed_large/NorCP_AROME_EC-EARTH
    invariant_variables_path: /Users/simon/Datasets/Norway/

    years: [1986, 1987]


    output_variables: ['precipitation']
    input_variables: ["hus500","hus850","ua500","ua850","va500","va850","ta500","ta850"]
    invariant_variables: ["elevation"]
    bounds: large

validation:
    years: [2003, 2004]


# Training parameters
training:
    hp:
        training_duration: 200
        batch_size_per_gpu: 2
        total_batch_size: 4
        lr: 0.0002

    perf:
        dataloader_workers: 0

    io:
        print_progress_freq: 10
        regression_checkpoint_path: /Users/simon/Datasets/Outputs/Models/reg_10_combined/checkpoints_regression/UNet.0.1500160.mdlus

        checkpoint_dir: output/test_edm2
        save_checkpoint_freq: 100000
        save_n_recent_checkpoints: 5


# Parameters for wandb logging
wandb:
    mode: online
    results_dir: "./wandb"
    watch_model: false
