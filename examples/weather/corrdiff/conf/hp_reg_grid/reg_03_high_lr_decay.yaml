# @package _global_
# Regression HP Grid - Config 03: Higher LR with decay
# lr=3e-4, batch=256, lr_decay=0.95, MSE loss, attn=[16]

defaults:
  - /hp_base_trainreg
  - _self_

hydra:
  job:
    name: reg_03_high_lr_decay

training:
  hp:
    lr: 3.0e-4
    total_batch_size: 256
    lr_decay: 0.95
  io:
    checkpoint_dir: /checkpoints/hp_reg_grid/reg_03_high_lr_decay

model:
  model_args:
    attn_resolutions: [16]
