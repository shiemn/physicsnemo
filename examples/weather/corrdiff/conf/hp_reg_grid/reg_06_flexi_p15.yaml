# @package _global_
# Regression HP Grid - Config 06: FlexiLoss p=1.5
# lr=1e-4, batch=256, lr_decay=1.0, FlexiLoss p=1.5, attn=[16]

defaults:
  - /hp_base_trainreg
  - _self_

hydra:
  job:
    name: reg_06_flexi_p15

training:
  hp:
    lr: 1.0e-4
    total_batch_size: 256
    lr_decay: 1.0
    loss_function: flexiloss
    flexi_loss_p: [1.5]
    flexi_loss_d: [1]
  io:
    checkpoint_dir: /checkpoints/hp_reg_grid/reg_06_flexi_p15

model:
  model_args:
    attn_resolutions: [16]

