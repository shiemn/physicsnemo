# @package _global_
# Regression HP Grid - Config 04: Small batch size
# lr=1e-4, batch=128, lr_decay=1.0, MSE loss, attn=[16]

defaults:
  - /hp_base_trainreg
  - _self_

hydra:
  job:
    name: reg_04_small_batch

training:
  hp:
    lr: 1.0e-4
    total_batch_size: 128
    lr_decay: 1.0
  io:
    checkpoint_dir: /checkpoints/hp_reg_grid/reg_04_small_batch

model:
  model_args:
    attn_resolutions: [16]
