# @package _global_
# Regression HP Grid - Config 05: Large batch size
# lr=2e-4, batch=512, lr_decay=1.0, MSE loss, attn=[16]
# Note: Scaled LR for larger batch (linear scaling rule)

defaults:
  - /hp_base_trainreg
  - _self_

hydra:
  job:
    name: reg_05_large_batch

training:
  hp:
    lr: 2.0e-4
    total_batch_size: 512
    lr_decay: 1.0
  io:
    checkpoint_dir: /checkpoints/hp_reg_grid/reg_05_large_batch

model:
  model_args:
    attn_resolutions: [16]
