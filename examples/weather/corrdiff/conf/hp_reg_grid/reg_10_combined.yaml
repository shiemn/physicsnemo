# @package _global_
# Regression HP Grid - Config 10: Combined variations
# lr=3e-4, batch=256, lr_decay=0.95, FlexiLoss p=1.5, attn=[8,16]

defaults:
  - /hp_base_trainreg
  - _self_

hydra:
  job:
    name: reg_10_combined

training:
  hp:
    lr: 3.0e-4
    total_batch_size: 256
    lr_decay: 0.95
    loss_function: flexiloss
    flexi_loss_p: [1.5]
    flexi_loss_d: [1]
  io:
    checkpoint_dir: /checkpoints/hp_reg_grid/reg_10_combined

model:
  model_args:
    attn_resolutions: [8, 16]
