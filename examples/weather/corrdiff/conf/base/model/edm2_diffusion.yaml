name: edm2_diffusion
hr_mean_conditioning: True

# EDM2 U-Net architecture parameters.
# These are passed directly to EDM2UNet via EDM2PrecondSuperResolution.
# img_resolution, img_in_channels, img_out_channels, use_fp16, and sigma_data
# are set automatically by train.py from the dataset and training config.
model_args:
  model_channels: 128
  # Base channel multiplier. Total channels at each level =
  # model_channels * channel_mult[level].
  # 128 gives ~90M params with [1,2,3,4] growth (between EDM1 "normal" ~50M
  # and the original EDM2 default of 192 which gives ~200M). Use 96 for ~50M.

  channel_mult: [1, 2, 3, 4]
  # Per-resolution channel multipliers.

  num_blocks: 3
  # Residual blocks per resolution level.

  attn_resolutions: [16, 8]
  # Pixel resolutions at which self-attention is applied.
  # Must be consistent with img_resolution (= min(H, W) of the dataset).
  # E.g. for a 128-pixel-wide image: level 0=128, 1=64, 2=32, 3=16, 4=8.

  # Spatial positional grid (same scheme as SongUNetPosEmbd, applied in the
  # preconditioner and combined with data channels via mp_cat):
  N_grid_channels: 4    # 0 to disable; must be 4 or a multiple of 4 for sinusoidal
  gridtype: sinusoidal   # "sinusoidal" or "linear" (linear requires N_grid_channels=2)
  grid_mp_balance: 0.5  # mp_cat balance: 0=data only, 1=grid only, 0.5=equal per-channel weight

  # Block-level hyperparameters (see helpers/edm2_networks.py Block):
  dropout: 0.0
  res_balance: 0.3       # Weight of residual branch vs main branch
  attn_balance: 0.3      # Weight of self-attention branch vs main branch
  clip_act: 256          # Activation clipping magnitude (None to disable)
  channels_per_head: 64  # Channels per attention head
