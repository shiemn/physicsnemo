# @package generation
# Held-out Taiwan 2021 centers with valid radar and ERA5 data at -3, 0, and +3 h.
# Derived from cwb_valid and all-channel era5_valid masks; 5,969 hourly centers.
#
# Expressed as the dense hourly range minus its data gaps. The gaps are what the
# validity masks exclude, so they are listed here rather than being implicit in a
# 5,969-entry timestamp dump. tests/test_taiwan_times_range.py pins the resolved
# list to the original enumeration.
times_range:
  - 2021-02-01T03:00:00
  - 2021-12-31T20:00:00
  - 1

# 36 windows, both endpoints inclusive, covering 2,041 excluded hours.
# The first is a two-month outage; the recurring 30 h windows are periodic
# radar/ERA5 unavailability.
times_exclude:
  - [2021-02-06T02:00:00, 2021-02-06T02:00:00]  # 1 h
  - [2021-02-06T05:00:00, 2021-02-06T05:00:00]  # 1 h
