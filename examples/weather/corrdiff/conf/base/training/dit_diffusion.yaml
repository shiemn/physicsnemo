# Training hyperparameters for DiT diffusion model.
# Inherits defaults from base_all.yaml; only differences are listed here.

hp:
  training_duration: 200000000
  total_batch_size: 256
  batch_size_per_gpu: "auto"
  lr: 0.0001          # DiT trains well at lower LR than UNet (0.0002)
  grad_clip_threshold: 1.0
  lr_decay: 1
  lr_rampup: 0
  lr_decay_rate: 5e5

perf:
  fp_optimizations: amp-bf16
  dataloader_workers: 4
  songunet_checkpoint_level: 0

io:
  regression_checkpoint_path: null
  print_progress_freq: 1000
  save_checkpoint_freq: 5000
  save_n_recent_checkpoints: -1
  validation_freq: 5000
  validation_steps: 10
