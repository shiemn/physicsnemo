# UNREFERENCED: nothing outside this file names it -- superseded by conf/train/taiwan/temporal_reg_3h.yaml.
# Kept for provenance of past runs; prefer the replacement for new work.
# Temporal regression training for Taiwan (CWA/CWB) — mini model, 3-hour offsets.
# Same as tr_reg_temporal_taiwan_mini but with strict_time_step_hours: 3 (context at -3h, 0h, +3h).

hydra:
    job:
          chdir: false
          name: tr_reg_temporal3h_taiwan_mini
    run:
          dir: ./output/${hydra:job.name}
    searchpath:
          - pkg://conf/base # Do not modify

defaults:
    - dataset: cwb
    - model: regression
    - model_size: mini
    - training: ${model}

dataset:
    data_path: /data/cwa_dataset/cwa_dataset.zarr
    temporal_inputs:
        offsets: [-3, 0, 3]
        boundary: drop
        strict_time_step_hours: 1

training:
    hp:
        training_duration: 2000000
        lr_rampup: 10000
        total_batch_size: 256
        batch_size_per_gpu: 8
        lr: 2.0e-4
    io:
        checkpoint_dir: /checkpoints/taiwan_regression_temporal3h_mini
        print_progress_freq: 1000
        save_checkpoint_freq: 100000
        save_n_recent_checkpoints: -1
        validation_freq: 5000
        validation_steps: 10

wandb:
    mode: online
    results_dir: "./wandb"
    watch_model: false
