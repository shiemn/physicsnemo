# Regression training for Taiwan (CWA/CWB) dataset — mini model size, no temporal conditioning.

hydra:
    job:
          chdir: false
          name: tr_reg_taiwan_mini
    run:
          dir: ./output/${hydra:job.name}
    searchpath:
          - pkg://conf/base # Do not modify

defaults:
    - dataset: cwb
    - model: regression
    - model_size: mini
    - training: ${model}

dataset:
    data_path: /data/cwa_dataset/cwa_dataset.zarr

training:
    hp:
        training_duration: 2000000
        lr_rampup: 10000
        total_batch_size: 256
        batch_size_per_gpu: 8
        lr: 2.0e-4
    io:
        checkpoint_dir: /checkpoints/taiwan_regression_mini
        print_progress_freq: 1000
        save_checkpoint_freq: 100000
        save_n_recent_checkpoints: -1
        validation_freq: 5000
        validation_steps: 10

wandb:
    mode: online
    results_dir: "./wandb"
    watch_model: false
