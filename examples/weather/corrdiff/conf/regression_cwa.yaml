hydra:
    job:
          chdir: false
          name: cwa_regression
    run:
          dir: ./output/${hydra:job.name}
    searchpath:
          - pkg://conf/base # Do not modify

defaults:
    - dataset: cwb
    - model: regression
    - model_size: normal
    - training: ${model}

dataset:
    data_path: /data/cwa_dataset.zarr

training:
    hp:
        training_duration: 2000000 #200000000
        lr_rampup: 10000
        batch_size_per_gpu: 4
    io:
        checkpoint_dir: /checkpoints/taiwan_regression
        save_checkpoint_freq: 100000
wandb:
    mode: online
    results_dir: "./wandb"
    watch_model: false
