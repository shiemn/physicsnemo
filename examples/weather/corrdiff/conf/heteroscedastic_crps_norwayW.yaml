# Config for testing heteroscedastic diffusion model with Gaussian CRPS loss
# Based on best hp_search parameters for reg_10_combined

hydra:
    job:
          chdir: false
          name: heteroscedastic_crps_norwayW
    run:
          dir: ./output/${hydra:job.name}
    searchpath:
          - pkg://conf/base # Do not modify


defaults:

    - dataset: custom
    - model: diffusion
    - model_size: normal
    - training: ${model}


# Model configuration - use heteroscedastic variant
model:
    name: heteroscedastic_diffusion  # Uses HeteroscedasticEDMPrecondSR
    hr_mean_conditioning: True

    # Heteroscedastic model specific parameters
    variance_channels: null  # If null, uses img_out_channels
    min_std: 1e-4  # Minimum std to prevent collapse

    # Sigma parameter from best hp_search
    sigma_data: 0.9991313898136948

    model_args:
        attn_resolutions: [16]

    # Loss function parameters (must be under model.hp for train.py)
    hp:
        loss_function: CalibratedResidualLoss
        crps_weight: 0.2
        min_std: 1e-4


# Dataset configuration
dataset:
    type: norway
    data_path: /data/Norway/HCLIM3/preprocessed_large/NorCP_AROME_EC-EARTH
    stats_path: /data/Norway/HCLIM3/preprocessed_large/NorCP_AROME_EC-EARTH
    invariant_variables_path: /data/Norway/HCLIM3/

    years: [1986, 1987, 1988, 1989, 1990, 1991, 1992, 1993, 1994, 1995, 1996, 1997, 1998, 1999, 2000, 2001]

    output_variables: ['precipitation']
    input_variables: ["hus500","hus850","ua500","ua850","va500","va850","ta500","ta850"]
    invariant_variables: ["elevation"]
    bounds: large

validation:
    years: [2003, 2004]


# Training parameters - based on best hp_search run
training:
    hp:
        # Best hyperparameters from hp_search
        training_duration: 1300000
        batch_size_per_gpu: 4
        lr: 0.0001748088800642186
        total_batch_size: 256

        # Noise distribution parameters from best hp_search
        distribution: normal
        P_mean: 0.33279831106168106
        P_std: 1.2828802382850724
        sigma_data: 0.9991313898136948

    io:
        print_progress_freq: 10000

        # Regression checkpoint from reg_10_combined at step 1,500,160
        regression_checkpoint_path: /checkpoints/hp_reg_grid/reg_10_combined/checkpoints_regression/UNet.0.1500160.mdlus

        checkpoint_dir: /checkpoints/heteroscedastic2_crps_mid
        save_checkpoint_freq: 100000
        save_n_recent_checkpoints: 3


# Parameters for wandb logging
wandb:
    mode: online
    results_dir: "./wandb"
    watch_model: false
