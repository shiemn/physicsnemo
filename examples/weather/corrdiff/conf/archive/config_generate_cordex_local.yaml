hydra:
    job:
          chdir: false
          name: generate_cordex_local
    run:
          dir: ./outputs/${hydra:job.name}
    searchpath:
          - pkg://conf/base # Do not modify

# Base parameters for dataset, model, and generation
defaults:

    - dataset: custom
    # The dataset type for training.
    # Accepted values:
    #   `gefs_hrrr`: full GEFS-HRRR dataset for continental US.
    #   `hrrr_mini`: smaller HRRR dataset (continental US), for fast experiments.
    #   `cwb`: full CWB dataset for Taiwan.
    #   `custom`: user-defined dataset. Parameters need to be specified below.

    # - model: diffusion
    - model_size: mini

    
    # The base generation parameters.
    - generation: non_patched
        # Accepted values:
    #     `patched`: base parameters for a patch-based model
    #     `non_patched`: base parameters for a non-patched model



# Dataset parameters. Used for `custom` dataset type.
# Modify or add below parameters that should be passed as argument to the
# user-defined dataset class.
dataset:
    type: cordex_bench # datasets/benchmark_dataset.py::CordexBenchDataset
    data_path: /Users/simon/Datasets/CordexBench/ALPS_domain
    domain: ALPS
    evaluation_type: PP
    gcm: CNRM-CM6-1
    task: pseudo-reality
    standardize: true
    stage: 'val'
    
    # CordexBench predictor variables - actual variables from the dataset
    input_variables: ["u_850", "u_700", "u_500", "v_850", "v_700", "v_500",
                      "q_850", "q_700", "q_500", "t_850", "t_700", "t_500",
                      "z_850", "z_700", "z_500"]
    output_variables: ['pr', 'tasmax']
    invariant_variables: ['Orog']


# Generation parameters to specialize
generation:
    hr_mean_conditioning: false
    num_ensembles: 2
    # int, number of ensembles to generate per input
    seed_batch_size: 2
    # int, size of the batched inference
    times_range: ["1979-01-01T00:00:00", "1979-10-01T23:59:59", 3]
    # inference_mode: regression
    # times_range: ["2004-01-01T00:00:00", "2005-12-31T23:59:59", 3]
    # times_range: ["2041-01-01T00:00:00", "2100-12-31T23:59:59", 3]
    # List[str] and interval in h, time range in ISO 8601 format. Replace with desired time range.
    # times: None
    # List[str], time stamps in ISO 8601 format. Replace and list desired target
    # time stamps.
    io:
        res_ckpt_filename: /Users/simon/Datasets/Outputs/Models/CordexAlps/checkpoints_diffusion/EDMPrecondSuperResolution.0.665088.mdlus
        #res_ckpt_filename: /checkpoints/norway_large/checkpoints_diffusion/EDMPrecondSuperResolution.0.10000128.mdlus
        #/checkpoints/norway_run2/checkpoints_diffusion/EDMPrecondSuperResolution.0.8000040.mdlus
        # Path to checkpoint file for the diffusion model  
        reg_ckpt_filename:  /Users/simon/Datasets/Outputs/Models/CordexAlps/checkpoints_regression/UNet.0.675072.mdlus
        #/checkpoints/norway_large/checkpoints_regression/UNet.0.1000192.mdlus 
        


        # Path to checkpoint filename for the mean predictor model
        output_filename: corrdif_cordex.nc
    
    perf:
        io_syncronous: false

# Parameters for wandb logging
wandb:
    mode: offline
    results_dir: "./wandb"
    # Directory to store wandb results
    watch_model: false
    # If true, wandb will track model parameters and gradients