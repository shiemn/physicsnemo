# Continue trial_7 diffusion training from 1.5M → 2.0M steps.
# Does NOT inherit hp_base_traindif (its hydra.searchpath causes a Hydra error
# when used as a non-primary config). Replicates its defaults directly.
# Training auto-resumes from latest checkpoint in checkpoint_dir.

hydra:
  searchpath:
    - pkg://conf/base
  job:
    chdir: false
    name: trial_7_continued
  run:
    dir: ./output/${hydra:job.name}

defaults:
  - dataset: custom
  - model: diffusion
  - model_size: normal
  - training: diffusion
  - _self_

dataset:
  type: norway
  data_path: /data/Norway/HCLIM3/preprocessed_large/NorCP_AROME_EC-EARTH
  stats_path: /data/Norway/HCLIM3/preprocessed_large/NorCP_AROME_EC-EARTH
  invariant_variables_path: /data/Norway/HCLIM3/
  output_variables: ['precipitation']
  input_variables: ["hus500","hus850","ua500","ua850","va500","va850","ta500","ta850"]
  invariant_variables: ["elevation"]
  bounds: large
  years: [1986, 1987, 1988, 1989, 1990, 1991, 1992, 1993, 1994, 1995, 1996, 1997, 1998, 1999, 2000, 2001]

validation:
  years: [2003, 2004]

model:
  model_args:
    attn_resolutions: [16]

training:
  hp:
    lr: 5.185225311935692e-4
    total_batch_size: 128
    batch_size_per_gpu: 4
    training_duration: 2000000
    distribution: normal
    P_mean: 0.7499199835165111
    P_std: 0.8440688577987278
    sigma_data: 0.8690460756242084
  io:
    regression_checkpoint_path: /checkpoints/hp_reg_grid/reg_07_flexi_p125/checkpoints_regression/UNet.0.2000128.mdlus
    checkpoint_dir: /checkpoints/hp_diff_search/trial_7
    save_checkpoint_freq: 100000
    save_n_recent_checkpoints: 5
    print_progress_freq: 100000

wandb:
  mode: online
  results_dir: "./wandb"
  watch_model: false
