hydra:
    job:
          chdir: false
          name: gen_diff_2_05
    run:
          dir: ./outputs/${hydra:job.name}
    searchpath:
          - pkg://conf/base # Do not modify

# Base parameters for dataset, model, and generation
defaults:

    - dataset: custom
    - generation: non_patched



dataset:
    type: norway #datasets/norway.py::NorwayDatasetH5
    data_path: /data/Norway/HCLIM3/preprocessed_large/NorCP_AROME_EC-EARTH
    stats_path: /data/Norway/HCLIM3/preprocessed_large/NorCP_AROME_EC-EARTH
    invariant_variables_path: /data/Norway/HCLIM3/
    
    # Path to json stats file
    output_variables: ['precipitation']
    input_variables: ["hus500","hus850","ua500","ua850","va500","va850","ta500","ta850"]
    invariant_variables: ["elevation"]
    bounds: large
    years: [2004, 2005]



# Generation parameters to specialize
generation:
    num_ensembles: 10
    # int, number of ensembles to generate per input
    seed_batch_size: 10
    # int, size of the batched inference
    times_range: ["2005-01-01T00:00:00", "2005-12-31T23:59:59", 3]
    io:
        res_ckpt_filename: /checkpoints/tr_diff_02/checkpoints_diffusion/EDMPrecondSuperResolution.0.500224.mdlus
        reg_ckpt_filename:  /checkpoints/norway_WL_28-11/checkpoints_regression/UNet.0.200192.mdlus
        output_filename: /outputs/gen_diff_2_05.nc

# Parameters for wandb logging
wandb:
    mode: online
    results_dir: "./wandb"
    # Directory to store wandb results
    watch_model: false
    # If true, wandb will track model parameters and gradients