# Norway past-only 3-hour temporal regression.

defaults:
  - /base_regression_norway
  - _self_

hydra:
  job:
    name: tr_reg_norway_past3h
  run:
    dir: ./output/${hydra:job.name}

dataset:
  temporal_inputs:
    offset_hours: [-3, 0]
    boundary: drop
    strict_time_step_hours: 3

training:
  io:
    checkpoint_dir: /checkpoints/temporal_regression/norway_past3h

wandb:
  group: norway_temporal_context_ladder
  tags: ["norway", "regression", "temporal_context:past_3h", "offsets:-3,0"]
