# UNREFERENCED: nothing outside this file names it -- superseded by conf/train/norway_temporal/.
# Kept for provenance of past runs; prefer the replacement for new work.
# Norway past-only 6-hour temporal regression.

defaults:
  - /base_regression_norway
  - _self_

hydra:
  job:
    name: tr_reg_norway_past6h
  run:
    dir: ./output/${hydra:job.name}

dataset:
  temporal_inputs:
    offset_hours: [-6, -3, 0]
    boundary: drop
    strict_time_step_hours: 3

training:
  io:
    checkpoint_dir: /checkpoints/temporal_regression/norway_past6h

wandb:
  group: norway_temporal_context_ladder
  tags: ["norway", "regression", "temporal_context:past_6h", "offsets:-6,-3,0"]
