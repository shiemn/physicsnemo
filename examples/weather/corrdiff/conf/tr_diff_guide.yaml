# Small diffusion model for autoguidance ("weak" model).
# ~5M params vs ~79M for the normal CorrDiff diffusion model.
#   - model_channels: 128 → 32
#   - channel_mult kept at 5 levels so attention at res=16 still fires on 512px
#
# The guide only needs coarse structure; the strong model adds detail via:
#   D_guided = D_main + w * (D_main - D_weak)
#
# HP params inherited from tr_diff_hp (best HP search result, trial 7).
#
# Usage:
#   torchrun --nproc_per_node=4 train.py --config-name=tr_diff_guide

hydra:
    job:
        chdir: false
        name: tr_diff_guide
    run:
        dir: ./output/${hydra:job.name}
    searchpath:
        - pkg://conf/base # Do not modify

defaults:
    - dataset: custom
    - model: diffusion
    - training: ${model}

model:
    model_args:
        model_channels: 32
        channel_mult: [1, 2, 2, 2, 2]
        attn_resolutions: [16]

dataset:
    type: norway
    data_path: /data/Norway/HCLIM3/preprocessed_large/NorCP_AROME_EC-EARTH
    stats_path: /data/Norway/HCLIM3/preprocessed_large/NorCP_AROME_EC-EARTH
    invariant_variables_path: /data/Norway/HCLIM3/
    output_variables: ['precipitation']
    input_variables: ["hus500","hus850","ua500","ua850","va500","va850","ta500","ta850"]
    invariant_variables: ["elevation"]
    bounds: large
    years: [1986, 1987, 1988, 1989, 1990, 1991, 1992, 1993, 1994, 1995, 1996, 1997, 1998, 1999, 2000, 2001]

validation:
    years: [2003, 2004]

training:
    hp:
        training_duration: 1000000
        total_batch_size: 128
        batch_size_per_gpu: 16
        # Tiny model → can fit 4× the batch per GPU (16 vs 4).
        lr: 5.185225311935692e-4
        distribution: normal
        P_mean: 0.7499199835165111
        P_std: 0.8440688577987278
        sigma_data: 0.8690460756242084
    io:
        print_progress_freq: 100000
        regression_checkpoint_path: /checkpoints/hp_reg_grid/reg_07_flexi_p125/checkpoints_regression/UNet.0.1700096.mdlus
        checkpoint_dir: /checkpoints/tr_diff_guide
        save_checkpoint_freq: 100000
        save_n_recent_checkpoints: 10

wandb:
    mode: online
    results_dir: "./wandb"
    watch_model: false
