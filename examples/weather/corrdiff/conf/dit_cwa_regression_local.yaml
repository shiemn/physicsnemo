hydra:
    job:
          chdir: false
          name: dit_cwa_regression_local
    run:
          dir: ./output/${hydra:job.name}
    searchpath:
          - pkg://conf/base

defaults:
    - dataset: cwb
    - model: dit_regression
    - training: dit_regression

dataset:
    data_path: /Users/simon/Datasets/CorrDiff/cwa_dataset_3months.zarr

# 3-month dataset is only 2018; is_2021 filter gives 0 validation samples.
# Use all_times to bypass the year filter for validation.
validation:
    train: false
    all_times: true

model:
    model_args:
        patch_size: 16     # 448/16 = 28 patches per side (784 tokens)
        hidden_size: 128
        depth: 2
        num_heads: 4
        attention_backend: timm

training:
    hp:
        training_duration: 20
        batch_size_per_gpu: 1
        total_batch_size: 1
        lr: 0.0001
    perf:
        dataloader_workers: 0
    io:
        print_progress_freq: 5
        save_checkpoint_freq: 100000
        checkpoint_dir: output/test_dit_cwa_regression
        save_n_recent_checkpoints: 1
        validation_freq: 20
        validation_steps: 2

wandb:
    mode: disabled
    results_dir: "./wandb"
    watch_model: false
