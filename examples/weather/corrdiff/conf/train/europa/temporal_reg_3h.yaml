# @package _global_
# Plain channel-stacked temporal regression for Europa, symmetric +/-3h context.

hydra:
    job:
          chdir: false
          name: tr_reg_temporal_europa_3h
    run:
          dir: ./output/${hydra:job.name}
    searchpath:
          - pkg://conf/base # Do not modify

defaults:
    - /dataset: europa
    - /model: regression
    - /model_size: normal
    - /training: ${model}
    - _self_

dataset:
    temporal_inputs:
        offsets: [-3, 0, 3]
        boundary: drop
        strict_time_step_hours: 1

training:
    hp:
        training_duration: 2000000
        lr_rampup: 10000
        total_batch_size: 256
        batch_size_per_gpu: 4
        lr: 2.0e-4
    io:
        checkpoint_dir: /checkpoints/temporal_regression/europa_channel_stack_3h
        print_progress_freq: 1000
        save_checkpoint_freq: 100000
        save_n_recent_checkpoints: -1
        validation_freq: 5000
        validation_steps: 10

wandb:
    mode: online
    results_dir: "./wandb"
    watch_model: false
    group: europa_temporal_context_ladder
    tags:
        - europa
        - regression
        - temporal_context:sym_3h
        - temporal_mixer:channel_stack
        - offsets:-3,0,+3
