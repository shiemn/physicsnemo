# @package _global_
# Taiwan wind: direct, normal size, no temporal context, seed 0.
hydra:
  job:
    chdir: false
    name: taiwan_ablation_ds1_${target}_${stage}
  searchpath:
    - pkg://conf/base
  run:
    dir: /outputs/hydra/${hydra:job.name}

defaults:
  - /dataset: cwb
  - /model: diffusion
  - /model_size: normal
  - /training: ${model}
  - _self_

target: wind
stage: direct
dataset:
  out_channels: [2, 3]
  ds_factor: 1
  data_path: /data/cwa_dataset/cwa_dataset.zarr
model:
  hr_mean_conditioning: false
training:
  hp:
    training_duration: 2000000
    total_batch_size: 256
    batch_size_per_gpu: 4
    lr: 2.0e-4
    lr_rampup: 100000
  io:
    checkpoint_dir: /checkpoints/taiwan_ablation_ds1/${target}/${stage}
    regression_checkpoint_path: null
    print_progress_freq: 1024
    save_checkpoint_freq: 100096
    save_n_recent_checkpoints: -1
    validation_freq: 100096
    validation_steps: 10
validation:
  train: false
  all_times: false
wandb:
  mode: online
  entity: dagewe_team1
  project: CorrDiff
  results_dir: /outputs/wandb/${hydra:job.name}
  watch_model: false
  group: taiwan_regression_ablation_ds1
  tags: [taiwan, wind, direct, t0, seed0, ds1, exposure2M]
