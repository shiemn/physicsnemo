# @package _global_
# Normal-size Taiwan diffusion conditioned on the past-only 12-hour regression.

hydra:
  job:
    chdir: false
    name: tr_diff_temporal_taiwan_past12h
  run:
    dir: ./output/${hydra:job.name}
  searchpath:
    - pkg://conf/base

defaults:
  - /dataset: cwb
  - /model: diffusion
  - /model_size: normal
  - /training: ${model}
  - _self_

dataset:
  data_path: /data/cwa_dataset/cwa_dataset.zarr
  temporal_inputs:
    offsets: [-12, -6, -3, 0]
    boundary: drop
    strict_time_step_hours: 1

model:
  hr_mean_conditioning: true

training:
  hp:
    training_duration: 2000000
    lr_rampup: 100000
    batch_size_per_gpu: 4
  io:
    checkpoint_dir: /checkpoints/taiwan_diffusion_past12h
    regression_checkpoint_path: /checkpoints/taiwan_regression_past12h/checkpoints_regression/UNet.0.2000128.mdlus
    save_checkpoint_freq: 100000
    save_n_recent_checkpoints: -1
    validation_freq: 100000
    print_progress_freq: 100000

validation:
  train: false
  all_times: false

wandb:
  mode: online
  results_dir: ./wandb
  watch_model: false
  group: taiwan_temporal_diffusion
  tags:
    - taiwan
    - diffusion
    - temporal_context:past_12h
    - conditioner:taiwan_past12h
    - offsets:-12,-6,-3,0
