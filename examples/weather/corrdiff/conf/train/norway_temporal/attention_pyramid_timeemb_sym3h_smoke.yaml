# @package _global_
# Smoke test for Norway symmetric 3-hour pyramid attention with learned temporal embeddings.

defaults:
  - /train/norway_temporal/attention_pyramid_timeemb_sym3h
  - _self_

hydra:
  job:
    name: tr_reg_norway_pyramid_attention_timeemb_sym3h_smoke
  run:
    dir: ./output/${hydra:job.name}

training:
  hp:
    batch_size_per_gpu: 4
    total_batch_size: 4
    training_duration: 128
  io:
    print_progress_freq: 16
    validation_freq: 128
    validation_steps: 1
    save_checkpoint_freq: 1000000000
    checkpoint_dir: /tmp/corrdiff_pyramid_attention_timeemb_sym3h_smoke

wandb:
  mode: disabled
