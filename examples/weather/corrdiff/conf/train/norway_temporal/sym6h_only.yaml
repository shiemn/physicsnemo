# @package _global_
# Norway symmetric 6-hour-only temporal regression.

defaults:
  - /base_regression_norway
  - _self_

hydra:
  job:
    name: tr_reg_norway_sym6h_only
  run:
    dir: ./output/${hydra:job.name}

dataset:
  temporal_inputs:
    offset_hours: [-6, 0, 6]
    boundary: drop
    strict_time_step_hours: 3

training:
  io:
    checkpoint_dir: /checkpoints/temporal_regression/norway_sym6h_only

wandb:
  group: norway_temporal_context_ladder
  tags: ["norway", "regression", "temporal_context:sym_6h_only", "offsets:-6,0,+6"]
